name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  # 1) Unit tests for every microservice
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "services/*/requirements.txt"
      - run: pip install Flask PyJWT requests
      - run: python -m unittest discover -s . -t . -v

  # 2) Integration test: start the real system (PostgreSQL + all services + gateway) and exercise it
  integration:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up -d --build
      - name: Wait for the gateway
        run: |
          for i in $(seq 1 60); do
            curl -fs http://localhost:8080/gateway-health && curl -fs http://localhost:8080/api/menu >/dev/null && exit 0
            sleep 3
          done
          docker compose logs
          exit 1
      - run: pip install requests
      - name: API smoke test
        run: python scripts/smoke_test.py http://localhost:8080
      - name: UI smoke test
        run: python scripts/ui_smoke_test.py http://localhost:8080
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=100
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  # 3) Build and publish one Docker image per component to GitHub Container Registry
  build-push:
    needs: [test, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: user-service,    file: services/user/Dockerfile }
          - { name: menu-service,    file: services/menu/Dockerfile }
          - { name: order-service,   file: services/order/Dockerfile }
          - { name: payment-service, file: services/payment/Dockerfile }
          - { name: frontend,        file: frontend/Dockerfile }
          - { name: gateway,         file: gateway/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/campuseats-${{ matrix.name }}
          tags: |
            type=sha,format=long
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # 4) Deploy to Kubernetes. Enabled only when the repository variable DEPLOY_ENABLED=true
  #    and the secret KUBE_CONFIG (base64 of your kubeconfig) exist. See docs/DEPLOYMENT.md.
  deploy:
    needs: build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: Point manifests at the images built for this commit
        working-directory: k8s
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          for svc in user-service menu-service order-service payment-service frontend gateway; do
            kustomize edit set image campuseats/$svc=${{ env.REGISTRY }}/$OWNER/campuseats-$svc:sha-${{ github.sha }}
          done
      - name: Apply
        run: kubectl apply -k k8s/
      - name: Wait for rollout
        run: |
          for d in user-service menu-service order-service payment-service frontend gateway; do
            kubectl -n campuseats rollout status deployment/$d --timeout=240s
          done
