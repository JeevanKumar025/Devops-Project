# DEV VALUES ONLY. For a real deployment replace them, or create the Secret from the command line:
#   kubectl -n campuseats create secret generic campuseats-secrets --from-literal=... (see docs/DEPLOYMENT.md)
# and remove this file from kustomization.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: campuseats-secrets
  namespace: campuseats
type: Opaque
stringData:
  POSTGRES_PASSWORD: "campus-dev-password"
  JWT_SECRET: "k8s-dev-jwt-secret-change-me-0123456789abcdef"
  SECRET_KEY: "k8s-dev-session-key-change-me"
  ADMIN_USERNAME: "admin"
  ADMIN_PASSWORD: "admin12345"
  GRAFANA_PASSWORD: "admin"
  USER_DATABASE_URL: "postgresql://campus:campus-dev-password@postgres:5432/userdb"
  MENU_DATABASE_URL: "postgresql://campus:campus-dev-password@postgres:5432/menudb"
  ORDER_DATABASE_URL: "postgresql://campus:campus-dev-password@postgres:5432/orderdb"
  PAYMENT_DATABASE_URL: "postgresql://campus:campus-dev-password@postgres:5432/paymentdb"
