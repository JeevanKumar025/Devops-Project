apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: campuseats
  labels: { app: user-service }
spec:
  replicas: 2
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: user-service }
  template:
    metadata:
      labels: { app: user-service, tier: backend }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5001"
    spec:
      containers:
        - name: user-service
          image: campuseats/user-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 5001 }]
          env:
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: campuseats-secrets, key: JWT_SECRET } }
            - name: ADMIN_USERNAME
              valueFrom: { secretKeyRef: { name: campuseats-secrets, key: ADMIN_USERNAME } }
            - name: ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: campuseats-secrets, key: ADMIN_PASSWORD } }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: campuseats-secrets, key: USER_DATABASE_URL } }
          readinessProbe:
            httpGet: { path: /health, port: 5001 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 5001 }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 300m, memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: campuseats
spec:
  type: ClusterIP
  selector: { app: user-service }
  ports:
    - { port: 5001, targetPort: 5001 }
