apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: campuseats
  labels: { app: order-service }
spec:
  replicas: 2
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: order-service }
  template:
    metadata:
      labels: { app: order-service, tier: backend }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5003"
    spec:
      containers:
        - name: order-service
          image: campuseats/order-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 5003 }]
          env:
            - { name: MENU_SERVICE_URL, value: "http://menu-service:5002" }
            - { name: PAYMENT_SERVICE_URL, value: "http://payment-service:5004" }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: campuseats-secrets, key: JWT_SECRET } }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: campuseats-secrets, key: ORDER_DATABASE_URL } }
          readinessProbe:
            httpGet: { path: /health, port: 5003 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 5003 }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 300m, memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: campuseats
spec:
  type: ClusterIP
  selector: { app: order-service }
  ports:
    - { port: 5003, targetPort: 5003 }
