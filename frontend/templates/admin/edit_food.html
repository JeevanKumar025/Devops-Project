{% extends "layout.html" %}
{% block title %}{{ 'Edit' if food else 'Add' }} food | CampusEats{% endblock %}
{% block main %}
  <section class="admin-page container"><a class="back-link" href="{{ url_for('admin_menu') }}">← Back to menu management</a><div class="admin-heading"><div><p class="eyebrow">CANTEEN ADMIN</p><h1>{{ 'Edit' if food else 'Add' }} <em>food.</em></h1></div></div>
    <form class="food-form" method="post"><input name="csrf_token" type="hidden" value="{{ csrf_token() }}"><label for="name">Food name</label><input id="name" name="name" maxlength="80" required value="{{ food.name if food else '' }}"><label for="description">Description</label><textarea id="description" name="description" maxlength="300" required>{{ food.description if food else '' }}</textarea><div class="form-two-columns"><div><label for="price">Price (₹)</label><input id="price" name="price" type="number" min="0" step="0.01" required value="{{ '%.2f' | format(food.price / 100) if food else '' }}"></div><div><label for="category_id">Category</label><select id="category_id" name="category_id" required>{% for category in categories %}<option value="{{ category.id }}" {% if food and food.category_id == category.id %}selected{% endif %}>{{ category.name }}</option>{% endfor %}</select></div></div><label for="image">Image URL or static path <small>(optional)</small></label><input id="image" name="image" maxlength="500" value="{{ food.image or '' if food else '' }}" placeholder="https://example.com/food.jpg"><label class="checkbox-label"><input name="available" type="checkbox" {% if not food or food.available %}checked{% endif %}> Available to students</label><button class="button button-primary button-large" type="submit">{{ 'Save changes' if food else 'Add food item' }} →</button></form>
  </section>
{% endblock %}
