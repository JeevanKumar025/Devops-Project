{% extends "layout.html" %}
{% block title %}Create account | CampusEats{% endblock %}
{% block main %}
  <section class="auth-page"><div class="auth-card">
    <p class="eyebrow">START ORDERING</p><h1>Join CampusEats.</h1>
    <p class="auth-intro">Create your student account to skip the queue at your campus canteen.</p>
    <form action="{{ url_for('register') }}" method="post" class="auth-form">
      <input name="csrf_token" type="hidden" value="{{ csrf_token() }}">
      <label for="username">Username</label><input id="username" name="username" type="text" minlength="3" maxlength="30" pattern="[A-Za-z0-9_]{3,30}" title="Use 3 to 30 letters, numbers, or underscores." autocomplete="username" required autofocus>
      <label for="password">Password</label><input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>
      <label for="confirmation">Confirm password</label><input id="confirmation" name="confirmation" type="password" minlength="8" autocomplete="new-password" required>
      <button class="button button-primary button-large form-submit" type="submit">Create account <span aria-hidden="true">→</span></button>
    </form>
    <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
  </div></section>
{% endblock %}
