# API gateway: the single public entry point. Routes /api/* to the right
# microservice and everything else to the web frontend.
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=general:10m rate=50r/s;

server {
    listen 80;
    server_tokens off;
    include /etc/nginx/resolver.conf;       # written at start-up from /etc/resolv.conf (Docker or Kubernetes DNS)

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID      $request_id;
    add_header       X-Request-ID      $request_id always;
    proxy_connect_timeout 3s;
    proxy_read_timeout    20s;

    location = /gateway-health { access_log off; return 200 "ok\n"; }

    # Stricter rate limit on login/register (brute-force protection).
    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        set $upstream http://user-service:5001;
        proxy_pass $upstream;
    }
    location /api/users/    { limit_req zone=general burst=50 nodelay; set $upstream http://user-service:5001;    proxy_pass $upstream; }
    location /api/menu      { limit_req zone=general burst=50 nodelay; set $upstream http://menu-service:5002;    proxy_pass $upstream; }
    location /api/orders    { limit_req zone=general burst=50 nodelay; set $upstream http://order-service:5003;   proxy_pass $upstream; }
    location /api/admin/    { limit_req zone=general burst=50 nodelay; set $upstream http://order-service:5003;   proxy_pass $upstream; }
    location /api/payments  { limit_req zone=general burst=50 nodelay; set $upstream http://payment-service:5004; proxy_pass $upstream; }

    location / {
        limit_req zone=general burst=100 nodelay;
        set $upstream http://frontend:5000;
        proxy_pass $upstream;
    }
}
