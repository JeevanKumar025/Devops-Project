# CampusEats - whole system on one machine:  docker compose up --build
# Open http://localhost:8080 (app), http://localhost:9090 (Prometheus), http://localhost:3000 (Grafana)
x-service-env: &service-env
  JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-before-deploying-0123456789}

x-service: &service
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campus-dev-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus"]
      interval: 5s
      timeout: 3s
      retries: 10

  user-service:
    <<: *service
    build: { context: ., dockerfile: services/user/Dockerfile }
    image: campuseats/user-service:local
    environment:
      <<: *service-env
      DATABASE_URL: postgresql://campus:${POSTGRES_PASSWORD:-campus-dev-password}@postgres:5432/userdb
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}

  menu-service:
    <<: *service
    build: { context: ., dockerfile: services/menu/Dockerfile }
    image: campuseats/menu-service:local
    environment:
      <<: *service-env
      DATABASE_URL: postgresql://campus:${POSTGRES_PASSWORD:-campus-dev-password}@postgres:5432/menudb

  payment-service:
    <<: *service
    build: { context: ., dockerfile: services/payment/Dockerfile }
    image: campuseats/payment-service:local
    environment:
      <<: *service-env
      DATABASE_URL: postgresql://campus:${POSTGRES_PASSWORD:-campus-dev-password}@postgres:5432/paymentdb

  order-service:
    <<: *service
    build: { context: ., dockerfile: services/order/Dockerfile }
    image: campuseats/order-service:local
    environment:
      <<: *service-env
      DATABASE_URL: postgresql://campus:${POSTGRES_PASSWORD:-campus-dev-password}@postgres:5432/orderdb
      MENU_SERVICE_URL: http://menu-service:5002
      PAYMENT_SERVICE_URL: http://payment-service:5004

  frontend:
    build: { context: ., dockerfile: frontend/Dockerfile }
    image: campuseats/frontend:local
    restart: unless-stopped
    environment:
      GATEWAY_URL: http://gateway
      SECRET_KEY: ${SECRET_KEY:-dev-session-key-change-me}
    depends_on: [gateway]

  gateway:
    build: { context: ., dockerfile: gateway/Dockerfile }
    image: campuseats/gateway:local
    restart: unless-stopped
    ports: ["8080:80"]
    depends_on: [user-service, menu-service, order-service, payment-service]

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:
